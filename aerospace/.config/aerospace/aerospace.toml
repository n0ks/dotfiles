config-version = 2

after-startup-command = [
  'exec-and-forget borders active_color=0xff2acaea inactive_color=0xff494d64 width=2.0',
]

start-at-login = false

# Reload once after enabling so the file watcher starts.
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Do not also move-mouse on focus-changed: it fights focus-follows-mouse.
focus-follows-mouse.enabled = true

# Required on config-version 2, otherwise empty workspaces disappear.
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "S"]

on-window-detected = [
  { if = 'test %{app-bundle-id} = org.mozilla.firefoxdeveloperedition', run = ['layout tiling', 'move-node-to-workspace 1'] },
  { if = 'test %{app-bundle-id} = com.microsoft.VSCode || test %{app-bundle-id} = com.todesktop.230313mzl4w4u92 || test %{app-bundle-id} = com.github.wez.wezterm', run = ['layout tiling', 'move-node-to-workspace 2'] },
  { if = 'test %{app-bundle-id} = org.jkiss.dbeaver.core.product', run = 'move-node-to-workspace 6' },
  { if = 'test %{app-bundle-id} = com.microsoft.teams2', run = 'move-node-to-workspace 9' },
  { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = 'move-node-to-workspace S' },
  { if = 'test %{app-bundle-id} = com.apple.finder', run = 'layout floating' },
  { if = 'test %{app-bundle-id} = com.apple.iphonesimulator || test %{app-name} ~= qemu-system', run = 'layout floating' },
]

[gaps]
inner.horizontal = 8
inner.vertical =   8
outer.left =       6
outer.bottom =     6
outer.top =        6
outer.right =      6


[mode.main.binding]

alt-r = 'mode resize'
alt-enter = 'exec-and-forget open -n /Applications/WezTerm.app && workspace 2'
alt-e = 'exec-and-forget open /Applications/Cursor.app && workspace 2'
alt-s = 'exec-and-forget open /Applications/Slack.app && workspace S'

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-h = 'focus --wrap-around left'
alt-j = 'focus --wrap-around down'
alt-k = 'focus --wrap-around up'
alt-l = 'focus --wrap-around right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-shift-z = 'fullscreen --no-outer-gaps'
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'
cmd-shift-s = 'move-node-to-workspace S'

cmd-h = [] # Disable "hide application"
cmd-alt-h = [] # Disable "hide others"

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
#s = ['layout sticky tiling', 'mode main'] # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

[mode.resize.binding]
minus = 'resize smart -70'
equal = 'resize smart +70'
esc = 'mode main'


[workspace-to-monitor-force-assignment]
9 = 'secondary'
